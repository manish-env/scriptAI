name: D1 Migration

on:
  push:
    branches: [main]
    paths:
      - schema.sql          # only runs when schema changes
  workflow_dispatch:        # also triggerable manually from GitHub UI

jobs:
  migrate:
    name: Apply D1 schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest d1 execute brandme-db \
            --file=schema.sql \
            --remote
